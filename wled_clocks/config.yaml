name: WLED zegary
version: "1.16.0"
slug: wled_clocks
description: 104 zegary i efektów dla panelu WLED (DDP) ze sterowaniem w pasku bocznym Home Assistant
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:clock-digital
panel_title: WLED zegary
homeassistant_api: true  # tylko odczyt położenia domu (pogoda, słońce), gdy lat/lon puste
ports:
  8098/tcp: null  # efekt „napisz” bez tunelu (msg_tunnel pusty); domyślnie niewystawiony
ports_description:
  8098/tcp: Wiadomości od widzów bez tunelu bore – tylko gdy msg_tunnel jest pusty
options:
  host: ""
  msg_tunnel: bore.pub
schema:
  host: str?
  lat: float?
  lon: float?
  msg_tunnel: str?
  msg_public: str?
  msg_proxy: bool?
